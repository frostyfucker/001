name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 001-productivity-intelligence-system # Set a branch to deploy from

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true # Fetch submodules if your project uses them
          fetch-depth: 0 # Fetch all history for .GitInfo

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Or your project's Node.js version

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs # The directory to publish (e.g., your build output directory)
          # cname: example.com # Uncomment if you have a custom domain
