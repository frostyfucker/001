name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - 001-productivity-intelligence-system # Set a branch to deploy from

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Clean build
        run: rm -rf .parcel-cache docs

      - name: Build project
        run: npm run build

      - name: Create .nojekyll file in root
        run: touch .nojekyll